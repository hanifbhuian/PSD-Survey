name: Update survey heading
on:
  push:
    paths:
      - '.github/workflows/update-survey-heading.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update heading and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<title>.*?</title>', '<title>পীরগাছা এলাকার বাজার ও নিত্যপ্রয়োজনীয় পণ্য সংগ্রহ বিষয়ক জরিপ</title>', text, count=1)
          text = re.sub(r'<meta name="description" content=".*?">', '<meta name="description" content="স্থানীয় মানুষের বাজার, নিত্যপ্রয়োজনীয় পণ্য সংগ্রহের অভ্যাস, অভিজ্ঞতা ও মতামত জানার জন্য এই সংক্ষিপ্ত জরিপ পরিচালিত হচ্ছে।">', text, count=1)
          text = re.sub(r'<meta property="og:title" content=".*?">', '<meta property="og:title" content="পীরগাছা এলাকার বাজার ও নিত্যপ্রয়োজনীয় পণ্য সংগ্রহ বিষয়ক জরিপ">', text, count=1)
          text = re.sub(r'<meta property="og:description" content=".*?">', '<meta property="og:description" content="স্থানীয় মানুষের বাজার, নিত্যপ্রয়োজনীয় পণ্য সংগ্রহের অভ্যাস, অভিজ্ঞতা ও মতামত জানার জন্য এই সংক্ষিপ্ত জরিপ পরিচালিত হচ্ছে।">', text, count=1)
          text = re.sub(
              r'(<header class="hero"><div class="wrap"><span class="badge">.*?</span>)<h1>.*?</h1><p>.*?</p>',
              r'\1<h1>পীরগাছা এলাকার বাজার ও নিত্যপ্রয়োজনীয় পণ্য সংগ্রহ বিষয়ক জরিপ</h1><p>স্থানীয় মানুষের বাজার, নিত্যপ্রয়োজনীয় পণ্য সংগ্রহের অভ্যাস, অভিজ্ঞতা ও মতামত জানার জন্য এই সংক্ষিপ্ত জরিপ পরিচালিত হচ্ছে।</p>',
              text,
              count=1,
              flags=re.S,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update survey heading and subheading"
          git push

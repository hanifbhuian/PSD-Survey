name: Pause survey
on:
  push:
    paths:
      - '.github/workflows/pause-survey.yml'
permissions:
  contents: write
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pause public survey form
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = re.sub(r'<title>.*?</title>', '<title>জরিপ সাময়িকভাবে বন্ধ | পীরগাছা</title>', text, count=1, flags=re.S)
          text = re.sub(r'<meta name="description" content=".*?">', '<meta name="description" content="১২০টি উত্তর সংগ্রহ সম্পন্ন হওয়ায় জরিপটি আপাতত সাময়িকভাবে বন্ধ রাখা হয়েছে।">', text, count=1, flags=re.S)
          text = re.sub(r'<meta property="og:title" content=".*?">', '<meta property="og:title" content="জরিপ সাময়িকভাবে বন্ধ">', text, count=1, flags=re.S)
          text = re.sub(r'<meta property="og:description" content=".*?">', '<meta property="og:description" content="আপনাদের অংশগ্রহণে ১২০টি উত্তর সংগ্রহ সম্পন্ন হয়েছে। নতুন উত্তর গ্রহণ আপাতত বন্ধ।">', text, count=1, flags=re.S)

          text = text.replace('<body>', '<body class="survey-paused">', 1)

          pause_css = '''
<style id="surveyPauseStyles">
body.survey-paused .intro,
body.survey-paused #surveyForm{display:none!important}
.survey-paused-card{margin:-22px auto 44px;position:relative;padding:34px 26px;text-align:center;background:#fff;border:1px solid #dcebe7;border-radius:24px;box-shadow:0 14px 35px rgba(15,118,110,.12)}
.survey-paused-icon{width:72px;height:72px;margin:0 auto 16px;display:grid;place-items:center;border-radius:50%;background:#ecfdf5;color:#0f766e;font-size:34px}
.survey-paused-card h2{margin:0 0 12px;font-size:clamp(25px,4vw,36px);color:#115e59}
.survey-paused-card p{margin:8px auto;max-width:720px;font-size:17px;color:#475569}
.survey-paused-count{display:inline-block;margin:16px 0 6px;padding:10px 16px;border-radius:999px;background:#f0fdfa;color:#115e59;font-weight:900;border:1px solid #bbf7d0}
</style>
'''
          text = text.replace('</head>', pause_css + '</head>', 1)

          paused_card = '''
<section id="surveyPausedCard" class="survey-paused-card">
  <div class="survey-paused-icon">✓</div>
  <h2>জরিপ গ্রহণ আপাতত বন্ধ রয়েছে</h2>
  <div class="survey-paused-count">১২০টি উত্তর সংগ্রহ সম্পন্ন</div>
  <p>আপনাদের আন্তরিক অংশগ্রহণের জন্য ধন্যবাদ। তথ্য যাচাই ও প্রাথমিক বিশ্লেষণের জন্য নতুন উত্তর গ্রহণ সাময়িকভাবে বন্ধ রাখা হয়েছে।</p>
  <p class="small">জরিপসংক্রান্ত যোগাযোগ: <a href="mailto:geoacademy001@gmail.com">geoacademy001@gmail.com</a></p>
</section>
'''
          text = text.replace('<main class="wrap">', '<main class="wrap">' + paused_card, 1)

          # Stop visitor/device tracking while the survey is paused.
          text = re.sub(r'<script src="device-guard\.js[^>]*></script>', '', text)
          text = re.sub(r'<script src="visitor-tracker\.js[^>]*></script>', '', text)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit paused form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Pause survey after 120 responses"
          git push
